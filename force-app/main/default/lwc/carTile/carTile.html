<template>
    <div>
        <div class="content">
            <img src={car.Picture_URL__c} alt={car.Name} class="slds-align_absolute-center carImage"/>
            <div>
                <p class="title slds-align_absolute-center">{car.Name}</p>
                <p class="slds-align_absolute-center">
                    MSRP: INR-
                    <lightning-formatted-number
                        format="currency"
                        currency-code="INR"
                        value={car.MSRP__c}
                        class="price"
                        maximum-fraction-digits="0"
                    ></lightning-formatted-number>
                </p>
            </div>
        </div>
    </div>
</template>
